[project]
name = "typely"
version = "0.1.0"
description = "A lightweight, descriptor-based data validation library."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "validators>=0.36.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["typely*"]

[dependency-groups]
dev = [
    "coverage>=7.17.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
